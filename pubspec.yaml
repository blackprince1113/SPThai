name: superthai
description: "SuperThai - Master Thai with ease."
publish_to: 'none'
version: 1.2.8+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  speech_to_text: ^7.0.0
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.2
  firebase_auth: ^5.1.1
  uuid: ^4.4.0
  provider: ^6.1.5+1
  flutter_launcher_icons: ^0.14.4
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  audioplayers: ^5.2.1
  flutter_markdown: ^0.7.3+1
  package_info_plus: ^10.2.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFC107"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
